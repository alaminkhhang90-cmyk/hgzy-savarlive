<script>
var dragging=false;
var activeBox=null;
var startX=0,startY=0,initialX=0,initialY=0;
var isUnlocked=false;

const PANEL_PASSWORD = 'sv';
const BASE_AMOUNT = 100;
const RECOVERY_AMOUNT = 200;
var currentStakeAmount = BASE_AMOUNT;
var consecutiveLosses = 0;
var lastAnalyzedIssue = null;
var lastPredictedSignal = null;
var lastPredictedNumber = null;
var lastSeenPeriod = null;
var cachedHistoryList = null;
var realLatencyMs = 8;
var isSyncingNow = false;

function checkPass(){
    var input = document.getElementById('pass-input').value.trim().toLowerCase();
    var err = document.getElementById('pass-err');
    if(input === PANEL_PASSWORD){
        isUnlocked = true;
        err.style.display = 'none';
        document.getElementById('pass-gate').style.display = 'none';
        openPanelDirectly();
    } else {
        err.style.display = 'block';
        document.getElementById('pass-input').value = '';
    }
}

function closePassGate(){
    document.getElementById('pass-gate').style.display = 'none';
    document.getElementById('pass-err').style.display = 'none';
}

document.getElementById('pass-input').addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
        checkPass();
    }
});

function getNumberColorClass(num){
    if(num === 0) return 'ball-zero-violet';
    if(num === 5) return 'ball-five-violet';
    if(num === 1 || num === 3 || num === 7 || num === 9) return 'ball-green';
    return 'ball-red';
}

function updateLiveLastResult(lastItem){
    if(!lastItem) return;
    let n = parseInt(lastItem.number, 10);
    if(Number.isNaN(n)) return;
    let s = (n >= 5) ? 'BIG' : 'SMALL';
    let p = String(lastItem.issueNumber).slice(-5);
    document.getElementById('last-live-display').innerHTML =
        `LIVE LAST (${p}): <span style='color:#fff;'>${s} ${n}</span> | 100৳ | ${realLatencyMs}ms`;
}

function openPanelDirectly(){
    var m=document.getElementById('mini');
    var p=document.getElementById('main');
    p.style.left=m.style.left || (m.offsetLeft+'px');
    p.style.top=m.style.top || (m.offsetTop+'px');
    p.style.display='flex';
    m.style.display='none';
}

function openM(){
    if(!isUnlocked){
        document.getElementById('pass-gate').style.display = 'flex';
        document.getElementById('pass-input').focus();
        return;
    }
    openPanelDirectly();
}

function closeM(){
    var m=document.getElementById('mini');
    var p=document.getElementById('main');
    m.style.left=p.style.left;
    m.style.top=p.style.top;
    p.style.display='none';
    m.style.display='flex';
}

function drag(el){
    el.addEventListener('touchstart',function(e){
        dragging=false;
        activeBox=el;
        startX=e.touches[0].clientX;
        startY=e.touches[0].clientY;
        initialX=el.offsetLeft;
        initialY=el.offsetTop;
    },{passive:true});

    document.addEventListener('touchmove',function(e){
        if(!activeBox)return;
        dragging=true;
        e.preventDefault();
        let x=initialX+(e.touches[0].clientX-startX);
        let y=initialY+(e.touches[0].clientY-startY);
        x = Math.max(4, Math.min(window.innerWidth - activeBox.offsetWidth - 4, x));
        y = Math.max(4, Math.min(window.innerHeight - activeBox.offsetHeight - 4, y));
        activeBox.style.left=x+'px';
        activeBox.style.top=y+'px';
        if(activeBox.id==='main'){
            document.getElementById('mini').style.left=x+'px';
            document.getElementById('mini').style.top=y+'px';
        }
    },{passive:false});

    document.addEventListener('touchend',function(){
        activeBox=null;
        setTimeout(function(){dragging=false},50);
    });
}

drag(document.getElementById('mini'));
drag(document.getElementById('main'));

document.getElementById('mini').addEventListener('click',function(){
    if(!dragging){
        openM();
    }
});

document.getElementById('btn-exec').onclick = function(){
    const tgHttps = 'https://t.me/+WZR7nsATt1szNmRh';
    const tgApp = 'tg://join?invite=WZR7nsATt1szNmRh';
    try {
        analyzeMarket(true);
    } catch (_) {}
    var opened = false;
    try {
        var popupWin = window.open(tgHttps, '_blank', 'noopener,noreferrer');
        if (popupWin && !popupWin.closed) {
            opened = true;
        }
    } catch (_) {}
    if (!opened) {
        try {
            window.top.location.href = tgHttps;
        } catch (_) {
            window.location.href = tgHttps;
        }
    }
    setTimeout(function(){
        if (document.visibilityState === 'visible') {
            try {
                window.location.assign(tgApp);
            } catch (_) {}
        }
    }, 350);
};

function fetchSingleEndpoint(baseUrl, timeoutMs, startT){
    const url = baseUrl + (baseUrl.indexOf('?') === -1 ? '?' : '&') + 'ts=' + Date.now();
    const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const limitMs = timeoutMs || 1800;
    const timerId = controller ? setTimeout(() => controller.abort(), limitMs) : null;

    return fetch(url, {
        cache: 'no-store',
        keepalive: true,
        signal: controller ? controller.signal : undefined
    }).then(r => {
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }).then(data => {
        if(timerId) clearTimeout(timerId);
        const list = data && data.data && data.data.list;
        if(!list || list.length < 5) throw new Error('Invalid list');
        const elapsed = Math.max(3, Math.round(performance.now() - startT));
        realLatencyMs = elapsed > 85 ? Math.max(10, Math.round(elapsed * 0.22)) : elapsed;
        cachedHistoryList = list;
        return list;
    }).catch(err => {
        if(timerId) clearTimeout(timerId);
        throw err;
    });
}

function fetchFastLiveHistory(timeoutMs){
    const startT = performance.now();
    const primary = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
    const secondary = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';

    return fetchSingleEndpoint(primary, timeoutMs || 1800, startT).catch(function(){
        return fetchSingleEndpoint(secondary, (timeoutMs || 1800) + 500, startT);
    });
}

function getSecLeft(){
    var now = new Date();
    var sec = 60 - now.getSeconds();
    return sec === 60 ? 60 : sec;
}

setInterval(function(){
    var pingEl = document.getElementById('ping');
    if(pingEl){
        var left = getSecLeft();
        var sStr = left < 10 ? ('0' + left) : String(left);
        pingEl.innerText = '00:' + sStr + ' | ' + (navigator.onLine ? realLatencyMs : 999) + 'ms';
    }
}, 500);

window.onload = function(){
    if(cachedHistoryList && cachedHistoryList.length >= 5){
        applyHistorySignal(cachedHistoryList, true);
    }
    analyzeMarket(true);
    setInterval(autoVerifyMarket, 1200);
    document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible'){
            autoVerifyMarket();
        }
    });
    var pre = document.createElement('link');
    pre.rel = 'prefetch';
    pre.href = 'https://t.me/+WZR7nsATt1szNmRh';
    document.head.appendChild(pre);
};

setInterval(function(){
    let isOnline = navigator.onLine;
    let netEl = document.getElementById('net-status');
    if(netEl){
        netEl.innerText = isOnline ? 'SAVAR NET: TURBO+' : 'SAVAR NET: OFFLINE';
        netEl.style.color = isOnline ? '#00ffcc' : '#ff0055';
    }
}, 900);

function getSavarNumberWeight(num){
    const map = {
        0: -1.15, 1: -0.75, 2: -0.85, 3: -0.65, 4: -0.90,
        5:  1.15, 6:  0.85, 7:  0.70, 8:  0.90, 9:  0.65
    };
    return map[num] ?? 0;
}

function computeSavarSignal(list, nextIssue){
    const nums = list.slice(0, 12).map(item => parseInt(item.number, 10)).filter(n => !Number.isNaN(n));
    const l0 = nums[0] ?? 0;
    const l1 = nums[1] ?? 0;
    const l2 = nums[2] ?? 0;
    const l3 = nums[3] ?? 0;
    const l4 = nums[4] ?? 0;

    let score = 0;
    const weights = [3.6, 2.7, 2.0, 1.4, 0.9, 0.5];
    nums.slice(0, 6).forEach((val, idx) => {
        const dir = val >= 5 ? 1 : -1;
        score += (dir * 0.75 + getSavarNumberWeight(val) * 0.55) * weights[idx];
    });

    const last10 = nums.slice(0, 10);
    if(last10.length > 0){
        const bigCnt = last10.filter(v => v >= 5).length;
        const smallCnt = last10.length - bigCnt;
        score += ((smallCnt - bigCnt) / last10.length) * 2.2;
    }

    let streak = 1;
    const firstBig = l0 >= 5;
    for(let i = 1; i < nums.length; i++){
        if((nums[i] >= 5) === firstBig) streak++;
        else break;
    }
    if(streak >= 3){
        const revBoost = Math.min(4.2, 2.0 + (streak - 3) * 0.85);
        score += firstBig ? -revBoost : revBoost;
    }

    const issueStr = String(nextIssue);
    const d1 = parseInt(issueStr.slice(-1), 10) || 0;
    const d2 = parseInt(issueStr.slice(-2, -1), 10) || 0;
    const d3 = parseInt(issueStr.slice(-3, -2), 10) || 0;
    score += (((d1 * 9 + d2 * 5 + d3 * 3) % 11) - 5) * 0.42;

    const shortAvg = (nums.slice(0, 3).reduce((a, b) => a + (b >= 5 ? 1 : -1), 0)) / 3;
    const midAvg = (nums.slice(0, 8).reduce((a, b) => a + (b >= 5 ? 1 : -1), 0)) / Math.max(1, nums.slice(0, 8).length);
    score += (shortAvg * 0.8 + midAvg * 0.6);

    if(consecutiveLosses > 0 && Math.abs(score) < 0.75){
        score += (l0 >= 5 ? -1.1 : 1.1);
    }

    const predictedSignal = score >= 0 ? 'BIG' : 'SMALL';
    const confidencePct = Math.min(94, Math.max(58, Math.round(58 + Math.abs(score) * 7.5)));
    const recentSet = new Set(nums.slice(0, 3));
    const seed = (l0 * 17 + l1 * 13 + l2 * 9 + l3 * 7 + l4 * 5 + d1 * 19 + d2 * 11) % 10;

    let exactNumber;
    if(predictedSignal === 'BIG'){
        const pool = [5, 6, 7, 8, 9];
        let filtered = pool.filter(x => !recentSet.has(x));
        if(!filtered.length) filtered = pool;
        exactNumber = filtered[seed % filtered.length];
    }else{
        const pool = [0, 1, 2, 3, 4];
        let filtered = pool.filter(x => !recentSet.has(x));
        if(!filtered.length) filtered = pool;
        exactNumber = filtered[seed % filtered.length];
    }

    return { predictedSignal, exactNumber, confidencePct };
}

function renderSavarSignal(predictedSignal, exactNumber, nextIssue, confidencePct){
    let colorClass = getNumberColorClass(exactNumber);
    let sigColor = predictedSignal === 'BIG' ? '#ffcc00' : '#00ffcc';
    let conf = confidencePct || 75;
    let modeTag = consecutiveLosses > 0 ? 'STEP-2 SAFE' : 'PROFIT GUARD';
    document.getElementById('screen-content').innerHTML=
    "<div class='signal-row'>" +
        "<div class='number-ball "+colorClass+"'>"+exactNumber+"</div>" +
        "<span class='signal-text' style='color:"+sigColor+";'>"+predictedSignal+"</span>" +
    "</div>" +
    "<div class='sub'>SAVAR P:"+String(nextIssue).slice(-5)+" | "+currentStakeAmount+"৳ ("+conf+"%)</div>"+
    "<div class='trend-info'>"+modeTag+" | SAVAR LIVE • TG</div>";
}

function applyHistorySignal(list, silentAuto){
    updateLiveLastResult(list[0]);
    var nextIssue = (BigInt(list[0].issueNumber) + 1n).toString();
    const { predictedSignal, exactNumber, confidencePct } = computeSavarSignal(list, nextIssue);

    lastAnalyzedIssue = list[0].issueNumber;
    lastPredictedSignal = predictedSignal;
    lastPredictedNumber = exactNumber;

    if(silentAuto){
        renderSavarSignal(predictedSignal, exactNumber, nextIssue, confidencePct);
    }else{
        setTimeout(function(){
            renderSavarSignal(predictedSignal, exactNumber, nextIssue, confidencePct);
        }, 220);
    }
}

function analyzeMarket(silentAuto){
    if(isSyncingNow && !silentAuto) return;

    if(!navigator.onLine){
        if(cachedHistoryList && cachedHistoryList.length >= 5){
            applyHistorySignal(cachedHistoryList, silentAuto);
            return;
        }
        if(!silentAuto) alert("⚠️ Internet connection lost!");
        return;
    }

    if(!silentAuto){
        isSyncingNow = true;
        document.getElementById('screen-content').innerHTML=
        "<div id='circle' class='circle' style='display:block'></div>" +
        "<div style='font-size:8.5px; color:#00ffcc; margin-top:4px;'>SAVAR TURBO SYNC...</div>";
    }

    fetchFastLiveHistory(silentAuto ? 1900 : 1400)
    .then(list => {
        isSyncingNow = false;
        applyHistorySignal(list, silentAuto);
    })
    .catch(() => {
        isSyncingNow = false;
        if(cachedHistoryList && cachedHistoryList.length >= 5){
            applyHistorySignal(cachedHistoryList, silentAuto);
        }else if(!silentAuto){
            document.getElementById('screen-content').innerHTML=
            "<div class='value'>TURBO RETRY</div>"+
            "<div class='sub'>AMOUNT: 100৳</div>"+
            "<div class='trend-info'>FAST RECONNECTING...</div>";
        }
    });
}

function autoVerifyMarket(){
    if(!navigator.onLine) return;

    fetchFastLiveHistory(1650)
    .then(list => {
        var last = list[0];
        const latestStr = String(last.issueNumber);
        const isNewPeriod = (lastSeenPeriod !== null && lastSeenPeriod !== latestStr);
        lastSeenPeriod = latestStr;

        updateLiveLastResult(last);

        if(lastPredictedSignal && last.issueNumber !== lastAnalyzedIssue && lastAnalyzedIssue !== null) {
            let actualWinNum = parseInt(last.number, 10);
            let actualSize = actualWinNum >= 5 ? 'BIG' : 'SMALL';
            let isWin = (lastPredictedSignal === actualSize) || (lastPredictedNumber === actualWinNum);

            let popup = document.getElementById('result-popup');
            let header = document.getElementById('popup-header');
            let amtElement = document.getElementById('popup-amount');
            let detailsElement = document.getElementById('popup-details');

            let usedStake = currentStakeAmount;
            if(isWin) {
                let winAmount = Math.round(usedStake * 0.96);
                consecutiveLosses = 0;
                currentStakeAmount = BASE_AMOUNT;
                header.innerText = "🎉 PROFIT LOCKED 🎉";
                header.style.color = "#00ffcc";
                amtElement.innerText = `+${winAmount}৳ (${usedStake}৳)`;
                detailsElement.innerHTML = `Period: ${last.issueNumber}<br>Hit Number: ${actualWinNum} (${actualSize}) • Next: 100৳`;
            } else {
                if(consecutiveLosses === 0){
                    consecutiveLosses = 1;
                    currentStakeAmount = RECOVERY_AMOUNT;
                } else {
                    consecutiveLosses = 0;
                    currentStakeAmount = BASE_AMOUNT;
                }
                header.innerText = "SAFE STEP";
                header.style.color = "#ffcc00";
                amtElement.innerText = `NEXT: ${currentStakeAmount}৳`;
                detailsElement.innerHTML = `Period: ${last.issueNumber}<br>Result: ${actualWinNum} (${actualSize})`;
            }

            if(isUnlocked){
                popup.style.display = 'flex';
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 2600);
            }

            lastAnalyzedIssue = last.issueNumber;
            lastPredictedSignal = null;

            const nextIssue = (BigInt(last.issueNumber) + 1n).toString();
            const nextSig = computeSavarSignal(list, nextIssue);
            lastPredictedSignal = nextSig.predictedSignal;
            lastPredictedNumber = nextSig.exactNumber;
            renderSavarSignal(nextSig.predictedSignal, nextSig.exactNumber, nextIssue, nextSig.confidencePct);
            return;
        }

        const nextIssue = (BigInt(last.issueNumber) + 1n).toString();
        if(isNewPeriod || !lastPredictedSignal){
            const sig = computeSavarSignal(list, nextIssue);
            lastPredictedSignal = sig.predictedSignal;
            lastPredictedNumber = sig.exactNumber;
            renderSavarSignal(sig.predictedSignal, sig.exactNumber, nextIssue, sig.confidencePct);
        }
    })
    .catch(() => {
        if(cachedHistoryList && cachedHistoryList.length >= 5 && !lastPredictedSignal){
            applyHistorySignal(cachedHistoryList, true);
        }
    });
}
